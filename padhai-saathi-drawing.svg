<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="oxyBlood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a8a"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <linearGradient id="deoxyBlood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ea6ff"/>
      <stop offset="100%" stop-color="#3355bb"/>
    </linearGradient>
    <linearGradient id="muscle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c46a6a"/>
      <stop offset="100%" stop-color="#8e3b3b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="400" fill="url(#bg)"/>
  <text x="300" y="28" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">हृदय (Heart) का चित्र</text>

  <!-- Superior Vena Cava -->
  <rect x="330" y="45" width="22" height="55" fill="url(#deoxyBlood)" stroke="#22336b" stroke-width="1.5"/>
  <text x="400" y="60" font-size="12" fill="#22336b">ऊपरी महाशिरा</text>
  <line x1="398" y1="63" x2="352" y2="70" stroke="#22336b" stroke-width="1"/>

  <!-- Aorta -->
  <path d="M300 45 C300 30 330 20 360 30 C380 37 390 55 390 75 L390 100 L370 100 L370 78 C370 65 360 55 345 55 C330 55 320 62 320 78 L320 100 L300 100 Z" fill="url(#oxyBlood)" stroke="#7a1f1f" stroke-width="1.5"/>
  <text x="420" y="35" font-size="12" fill="#7a1f1f">महाधमनी (Aorta)</text>
  <line x1="418" y1="38" x2="365" y2="45" stroke="#7a1f1f" stroke-width="1"/>

  <!-- Pulmonary artery -->
  <path d="M270 60 C260 45 250 45 240 55 C232 63 232 80 240 90 L255 100 L270 90 Z" fill="url(#deoxyBlood)" stroke="#22336b" stroke-width="1.5"/>
  <text x="150" y="45" font-size="12" fill="#22336b">फुफ्फुसीय धमनी</text>
  <line x1="200" y1="48" x2="250" y2="60" stroke="#22336b" stroke-width="1"/>

  <!-- Pulmonary veins -->
  <ellipse cx="410" cy="110" rx="12" ry="20" fill="url(#oxyBlood)" stroke="#7a1f1f" stroke-width="1.5"/>
  <ellipse cx="430" cy="130" rx="10" ry="16" fill="url(#oxyBlood)" stroke="#7a1f1f" stroke-width="1.5"/>
  <text x="470" y="105" font-size="12" fill="#7a1f1f">फुफ्फुसीय शिरा</text>
  <line x1="468" y1="108" x2="420" y2="112" stroke="#7a1f1f" stroke-width="1"/>

  <!-- Main heart body -->
  <path d="M300 350
           C230 300 150 250 150 180
           C150 130 190 100 230 100
           C260 100 285 115 300 140
           C315 115 340 100 370 100
           C410 100 450 130 450 180
           C450 250 370 300 300 350 Z"
        fill="url(#muscle)" stroke="#5a1f1f" stroke-width="3"/>

  <!-- Right atrium -->
  <ellipse cx="360" cy="130" rx="45" ry="40" fill="url(#deoxyBlood)" stroke="#22336b" stroke-width="2" opacity="0.85"/>
  <text x="440" y="150" font-size="12" fill="#22336b">दायां अलिंद (RA)</text>
  <line x1="438" y1="147" x2="395" y2="140" stroke="#22336b" stroke-width="1"/>

  <!-- Left atrium -->
  <ellipse cx="250" cy="130" rx="45" ry="40" fill="url(#oxyBlood)" stroke="#7a1f1f" stroke-width="2" opacity="0.85"/>
  <text x="150" y="150" font-size="12" fill="#7a1f1f">बायां अलिंद (LA)</text>
  <line x1="180" y1="147" x2="215" y2="140" stroke="#7a1f1f" stroke-width="1"/>

  <!-- Septum -->
  <line x1="300" y1="140" x2="300" y2="330" stroke="#3a1414" stroke-width="3"/>

  <!-- Right ventricle -->
  <path d="M300 190 C340 195 380 220 385 260 C388 290 360 310 320 320 L300 300 Z"
        fill="url(#deoxyBlood)" stroke="#22336b" stroke-width="2" opacity="0.85"/>
  <text x="440" y="260" font-size="12" fill="#22336b">दायां निलय (RV)</text>
  <line x1="438" y1="257" x2="370" y2="255" stroke="#22336b" stroke-width="1"/>

  <!-- Left ventricle -->
  <path d="M300 190 C260 195 210 225 205 270 C202 300 240 325 290 335 L300 300 Z"
        fill="url(#oxyBlood)" stroke="#7a1f1f" stroke-width="2" opacity="0.85"/>
  <text x="120" y="270" font-size="12" fill="#7a1f1f">बायां निलय (LV)</text>
  <line x1="150" y1="267" x2="220" y2="265" stroke="#7a1f1f" stroke-width="1"/>

  <!-- Valves -->
  <ellipse cx="300" cy="180" rx="10" ry="6" fill="#fff5cc" stroke="#a68b00" stroke-width="1.5"/>
  <ellipse cx="255" cy="180" rx="10" ry="6" fill="#fff5cc" stroke="#a68b00" stroke-width="1.5"/>
  <text x="60" y="200" font-size="12" fill="#a68b00">हृदय वाल्व</text>
  <line x1="90" y1="197" x2="248" y2="182" stroke="#a68b00" stroke-width="1"/>

  <!-- Inferior vena cava -->
  <rect x="350" y="250" width="18" height="70" fill="url(#deoxyBlood)" stroke="#22336b" stroke-width="1.5" transform="rotate(15 350 250)"/>
  <text x="450" y="330" font-size="12" fill="#22336b">निचली महाशिरा</text>
  <line x1="448" y1="327" x2="390" y2="300" stroke="#22336b" stroke-width="1"/>

  <!-- Apex -->
  <text x="290" y="365" font-size="12" fill="#5a1f1f" font-weight="bold">शीर्ष (Apex)</text>

  <!-- Legend -->
  <rect x="20" y="360" width="15" height="15" fill="url(#oxyBlood)"/>
  <text x="40" y="372" font-size="12" fill="#333">ऑक्सीजनयुक्त रक्त</text>
  <rect x="200" y="360" width="15" height="15" fill="url(#deoxyBlood)"/>
  <text x="220" y="372" font-size="12" fill="#333">ऑक्सीजन रहित रक्त</text>
  <rect x="400" y="360" width="15" height="15" fill="url(#muscle)"/>
  <text x="420" y="372" font-size="12" fill="#333">हृदय पेशी</text>
</svg>