<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ajeet Web Lab</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#070b16;
  --panel:#101728;
  --panel2:#151d31;
  --text:#f4f7ff;
  --muted:#8e9ab5;
  --line:rgba(255,255,255,.09);
  --accent:#00eaff;
  --accent2:#7c3cff;
  --danger:#ff426d;
  --success:#31e981;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

body.light{
  --bg:#eef2f8;
  --panel:#ffffff;
  --panel2:#f5f7fb;
  --text:#101522;
  --muted:#667085;
  --line:rgba(0,0,0,.09);
  --shadow:0 20px 50px rgba(40,50,80,.15);
}

body{
  background:
    radial-gradient(circle at 10% 10%,rgba(0,234,255,.09),transparent 25%),
    radial-gradient(circle at 90% 20%,rgba(124,60,255,.12),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  transition:.35s;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:245px;
  height:100vh;
  padding:22px 15px;
  background:rgba(10,15,28,.88);
  backdrop-filter:blur(20px);
  border-right:1px solid var(--line);
  z-index:1000;
  transition:.35s;
}

body.light .sidebar{
  background:rgba(255,255,255,.9);
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 10px 25px;
}

.logoIcon{
  width:43px;
  height:43px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  font-weight:900;
  font-size:19px;
  box-shadow:0 0 30px rgba(0,234,255,.25);
}

.logo h2{
  font-size:18px;
}

.logo small{
  color:var(--muted);
  display:block;
  margin-top:3px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:13px;
  text-align:left;
  border-radius:12px;
  cursor:pointer;
  transition:.25s;
  font-size:14px;
}

.nav button:hover{
  color:var(--text);
  background:rgba(255,255,255,.06);
  transform:translateX(3px);
}

.nav button.active{
  color:white;
  background:linear-gradient(90deg,rgba(0,234,255,.17),rgba(124,60,255,.15));
  box-shadow:inset 3px 0 var(--accent);
}

body.light .nav button.active{
  color:#111827;
}

.menuBtn{
  display:none;
}

/* ================= MAIN ================= */

.main{
  margin-left:245px;
  padding:25px;
  min-height:100vh;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:25px;
}

.search{
  flex:1;
  max-width:500px;
  position:relative;
}

.search input{
  width:100%;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  outline:none;
  padding:14px 17px;
  border-radius:14px;
}

.topActions{
  display:flex;
  gap:10px;
}

.iconBtn{
  width:44px;
  height:44px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:13px;
  cursor:pointer;
  transition:.2s;
}

.iconBtn:hover{
  transform:translateY(-2px);
}

.page{
  display:none;
  animation:pageIn .4s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.hero{
  min-height:270px;
  padding:38px;
  border:1px solid var(--line);
  border-radius:25px;
  background:
    linear-gradient(135deg,rgba(0,234,255,.10),rgba(124,60,255,.08)),
    var(--panel);
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.hero:before{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  right:-100px;
  top:-130px;
  border:1px solid rgba(0,234,255,.18);
  box-shadow:0 0 100px rgba(0,234,255,.12);
}

.hero h1{
  font-size:clamp(32px,6vw,64px);
  line-height:1;
  margin-bottom:15px;
}

.gradient{
  background:linear-gradient(90deg,var(--accent),#fff,var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
  max-width:650px;
  line-height:1.7;
}

.badge{
  display:inline-block;
  margin-bottom:15px;
  padding:7px 11px;
  border-radius:30px;
  background:rgba(0,234,255,.1);
  color:var(--accent);
  font-size:12px;
  border:1px solid rgba(0,234,255,.2);
}

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:28px 0 15px;
}

.sectionTitle h2{
  font-size:21px;
}

.muted{
  color:var(--muted);
}

/* ================= CARDS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:20px;
}

.stat{
  padding:20px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
}

.stat b{
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}

.projects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  padding:20px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:19px;
  cursor:pointer;
  transition:.3s;
  min-height:175px;
  position:relative;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  right:-70px;
  top:-70px;
  background:var(--accent);
  filter:blur(60px);
  opacity:.08;
}

.card:hover{
  transform:translateY(-6px);
  border-color:rgba(0,234,255,.3);
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.cardIcon{
  font-size:32px;
  margin-bottom:14px;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.openDemo{
  margin-top:15px;
  color:var(--accent);
  font-size:12px;
}

/* ================= BUTTONS ================= */

.btn{
  border:0;
  padding:12px 18px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(0,234,255,.18);
}

.btn:active{
  transform:scale(.95);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(900px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:23px;
  box-shadow:0 30px 100px rgba(0,0,0,.5);
  animation:modalIn .3s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:scale(.93) translateY(20px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:var(--panel);
  z-index:2;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.07);
  color:var(--text);
  cursor:pointer;
}

.demoArea{
  min-height:430px;
  display:grid;
  place-items:center;
  padding:30px;
  position:relative;
  overflow:hidden;
}

/* ================= HEART ================= */

.heartDemo{
  text-align:center;
}

.heart{
  font-size:130px;
  display:block;
  animation:heartBeat .9s infinite;
  filter:drop-shadow(0 0 25px #ff376d);
}

@keyframes heartBeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.2)}
  30%{transform:scale(1)}
  45%{transform:scale(1.15)}
}

.pulseLine{
  width:330px;
  max-width:90vw;
  height:70px;
  position:relative;
  overflow:hidden;
}

.pulseLine:before{
  content:"";
  position:absolute;
  width:200%;
  height:2px;
  top:35px;
  left:0;
  background:linear-gradient(
    90deg,
    transparent 0 15%,
    #ff376d 15% 16%,
    transparent 16% 30%,
    #ff376d 30% 31%,
    transparent 31% 43%,
    #ff376d 43% 44%,
    transparent 44% 100%
  );
  animation:lineMove 1s linear infinite;
}

@keyframes lineMove{
  to{transform:translateX(-50%)}
}

/* ================= NEON ================= */

.neonText{
  font-size:60px;
  text-align:center;
  color:#fff;
  text-shadow:
    0 0 5px #fff,
    0 0 15px #00eaff,
    0 0 35px #00eaff,
    0 0 70px #7c3cff;
  animation:neonFlicker 1.6s infinite;
}

@keyframes neonFlicker{
  0%,18%,22%,62%,64%,100%{opacity:1}
  20%,63%{opacity:.45}
}

/* ================= LIGHTNING ================= */

.lightning{
  font-size:150px;
  animation:lightning 1.2s infinite;
}

@keyframes lightning{
  0%,90%,100%{
    opacity:.3;
    transform:scale(1);
  }
  91%,93%,96%{
    opacity:1;
    transform:scale(1.12);
    filter:drop-shadow(0 0 35px #ffe600);
  }
}

/* ================= WATER ================= */

.water{
  width:300px;
  height:300px;
  position:relative;
  display:grid;
  place-items:center;
}

.wave{
  position:absolute;
  width:60px;
  height:60px;
  border:3px solid #00eaff;
  border-radius:50%;
  animation:wave 2.4s infinite;
}

.wave:nth-child(2){animation-delay:.6s}
.wave:nth-child(3){animation-delay:1.2s}
.wave:nth-child(4){animation-delay:1.8s}

@keyframes wave{
  0%{
    width:50px;
    height:50px;
    opacity:1;
  }
  100%{
    width:300px;
    height:300px;
    opacity:0;
  }
}

.drop{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#00eaff;
  box-shadow:0 0 30px #00eaff;
}

/* ================= ROCKET ================= */

.rocketDemo{
  height:400px;
  width:100%;
  position:relative;
  overflow:hidden;
}

.rocket{
  position:absolute;
  font-size:80px;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  animation:rocketFly 3s ease-in-out infinite;
}

.flame{
  position:absolute;
  font-size:40px;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  animation:flame .18s infinite alternate;
}

@keyframes rocketFly{
  0%,100%{bottom:30px}
  50%{bottom:260px}
}

@keyframes flame{
  to{transform:translateX(-50%) scale(1.4)}
}

/* ================= GALAXY ================= */

.galaxy{
  width:350px;
  height:350px;
  position:relative;
  display:grid;
  place-items:center;
}

.sun{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#ffd42a;
  box-shadow:0 0 50px #ff9d00;
}

.orbit{
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
  animation:rotate 5s linear infinite;
}

.orbit1{width:150px;height:150px}
.orbit2{width:250px;height:250px;animation-duration:8s}
.orbit3{width:340px;height:340px;animation-duration:12s}

.planet{
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#00eaff;
  top:-9px;
  left:50%;
  box-shadow:0 0 15px #00eaff;
}

.orbit2 .planet{
  background:#7c3cff;
  box-shadow:0 0 15px #7c3cff;
}

.orbit3 .planet{
  background:#ff426d;
  box-shadow:0 0 15px #ff426d;
}

@keyframes rotate{
  to{transform:rotate(360deg)}
}

/* ================= BRAIN ================= */

.brain{
  width:350px;
  height:350px;
  position:relative;
  animation:brainFloat 2.5s ease-in-out infinite;
}

@keyframes brainFloat{
  50%{transform:translateY(-12px)}
}

.node{
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#00eaff;
  box-shadow:0 0 20px #00eaff;
  animation:nodePulse 1s infinite alternate;
}

@keyframes nodePulse{
  to{transform:scale(1.5)}
}

.node:nth-child(1){left:25%;top:20%}
.node:nth-child(2){left:60%;top:18%}
.node:nth-child(3){left:15%;top:50%}
.node:nth-child(4){left:50%;top:42%}
.node:nth-child(5){left:80%;top:50%}
.node:nth-child(6){left:30%;top:75%}
.node:nth-child(7){left:65%;top:75%}

.connection{
  position:absolute;
  height:2px;
  background:linear-gradient(90deg,transparent,#00eaff,transparent);
  transform-origin:left;
  animation:connection 1s infinite;
}

.c1{width:140px;left:27%;top:24%;transform:rotate(0deg)}
.c2{width:150px;left:22%;top:52%;transform:rotate(-20deg)}
.c3{width:130px;left:31%;top:70%;transform:rotate(-70deg)}
.c4{width:140px;left:52%;top:45%;transform:rotate(-65deg)}
.c5{width:130px;left:53%;top:45%;transform:rotate(12deg)}
.c6{width:130px;left:50%;top:46%;transform:rotate(70deg)}

@keyframes connection{
  50%{opacity:.3}
}

/* ================= MATRIX ================= */

.matrix{
  width:100%;
  height:400px;
  overflow:hidden;
  background:#020805;
  display:flex;
  justify-content:space-around;
}

.matrix span{
  color:#00ff6a;
  writing-mode:vertical-rl;
  font-size:18px;
  line-height:1.5;
  animation:matrixRain linear infinite;
  text-shadow:0 0 8px #00ff6a;
}

.matrix span:nth-child(odd){animation-duration:2.5s}
.matrix span:nth-child(even){animation-duration:4s}
.matrix span:nth-child(3n){animation-duration:3.2s}

@keyframes matrixRain{
  from{transform:translateY(-500px)}
  to{transform:translateY(500px)}
}

/* ================= 3D HOUSE ================= */

.houseScene{
  perspective:800px;
  width:330px;
  height:330px;
  display:grid;
  place-items:center;
}

.house3d{
  width:190px;
  height:150px;
  position:relative;
  transform-style:preserve-3d;
  transform:rotateX(-15deg) rotateY(-30deg);
  animation:houseRotate 8s linear infinite;
}

@keyframes houseRotate{
  to{transform:rotateX(-15deg) rotateY(330deg)}
}

.houseBody{
  position:absolute;
  width:190px;
  height:130px;
  bottom:0;
  background:linear-gradient(135deg,#5b67ff,#252b70);
  border:2px solid rgba(255,255,255,.2);
  transform:translateZ(50px);
}

.houseSide{
  position:absolute;
  width:100px;
  height:130px;
  right:-100px;
  bottom:0;
  background:#303778;
  transform-origin:left;
  transform:rotateY(90deg);
}

.roof{
  position:absolute;
  width:0;
  height:0;
  border-left:110px solid transparent;
  border-right:110px solid transparent;
  border-bottom:90px solid #ff426d;
  top:-85px;
  left:-15px;
  transform:translateZ(50px);
}

.window{
  position:absolute;
  width:35px;
  height:40px;
  background:#00eaff;
  box-shadow:0 0 15px #00eaff;
  left:35px;
  top:35px;
}

.door{
  position:absolute;
  width:42px;
  height:70px;
  background:#151525;
  bottom:0;
  right:35px;
}

/* ================= CYBER BUTTON ================= */

.cyberWrap{
  text-align:center;
}

.cyberBtn{
  padding:20px 50px;
  border:2px solid #00eaff;
  background:#06131b;
  color:#00eaff;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);
  box-shadow:0 0 20px rgba(0,234,255,.3);
  transition:.2s;
}

.cyberBtn:hover{
  background:#00eaff;
  color:#001016;
  box-shadow:0 0 50px #00eaff;
}

.cyberBtn:active{
  transform:scale(.92);
}

/* ================= NEON RING ================= */

.ring{
  width:160px;
  height:160px;
  border:8px solid rgba(255,255,255,.08);
  border-top-color:#00eaff;
  border-right-color:#7c3cff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  box-shadow:0 0 30px rgba(0,234,255,.3);
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ================= CALCULATOR ================= */

.calc{
  width:min(420px,100%);
  background:var(--panel);
  padding:20px;
  border:1px solid var(--line);
  border-radius:22px;
}

.calcDisplay{
  width:100%;
  height:75px;
  background:var(--panel2);
  color:var(--text);
  border:0;
  outline:0;
  border-radius:15px;
  text-align:right;
  padding:15px;
  font-size:30px;
  margin-bottom:12px;
}

.calcGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.calcGrid button{
  height:60px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel2);
  color:var(--text);
  font-size:18px;
  cursor:pointer;
  transition:.15s;
}

.calcGrid button:hover{
  background:rgba(0,234,255,.12);
}

.calcGrid button:active{
  transform:scale(.92);
}

.equal{
  background:linear-gradient(135deg,var(--accent),var(--accent2)) !important;
  color:white !important;
}

/* ================= ANDROID ================= */

.androidWrap{
  display:flex;
  justify-content:center;
  padding:25px;
}

.phone{
  width:310px;
  height:620px;
  background:#05070c;
  border:8px solid #222;
  border-radius:38px;
  padding:12px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  position:relative;
}

.notch{
  position:absolute;
  width:110px;
  height:22px;
  background:#111;
  top:0;
  left:50%;
  transform:translateX(-50%);
  border-radius:0 0 15px 15px;
  z-index:3;
}

.phoneScreen{
  width:100%;
  height:100%;
  border-radius:28px;
  background:
    radial-gradient(circle at 30% 20%,#28427b,transparent 25%),
    linear-gradient(150deg,#101c38,#080c18);
  padding:35px 14px 15px;
  overflow:hidden;
}

.phoneTime{
  font-size:42px;
  font-weight:bold;
  margin-bottom:5px;
}

.phoneDate{
  color:#aab7d4;
  margin-bottom:25px;
}

.appGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px 10px;
}

.app{
  text-align:center;
  cursor:pointer;
}

.appIcon{
  width:48px;
  height:48px;
  margin:auto auto 6px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,#00eaff,#7c3cff);
  color:white;
  font-size:20px;
}

.app small{
  font-size:10px;
  color:white;
}

/* ================= GALLERY ================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.galleryItem{
  height:180px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:55px;
  cursor:pointer;
  border:1px solid var(--line);
  background:linear-gradient(135deg,#15223e,#0b1020);
  transition:.3s;
}

.galleryItem:hover{
  transform:scale(1.03);
}

/* ================= SETTINGS ================= */

.settings{
  display:grid;
  gap:15px;
  max-width:700px;
}

.setting{
  padding:20px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.setting p{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.select{
  padding:11px;
  border-radius:10px;
  border:1px solid var(--line);
